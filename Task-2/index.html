<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Fall Limited Edition Sneakers</title>
  </head>

  <body>
    <div class="container">
      <header class="head">
        <img src="images/logo.svg" />

        <nav>
          <ul>
            <li>
              <a href="#">Collections</a>
              <a href="#">Men</a>
              <a href="#">Women</a>
              <a href="#">About</a>
              <a href="#">Contact</a>
            </li>
          </ul>
        </nav>

        <div class="cart">
          <img src="images/icon-cart.svg" />
          <img src="images/image-avatar.png" class="avatar" />
        </div>
      </header>
      <hr />

      <article>
        <div class="grid-2-columns">
          <div class="sneakers">
            <img src="images/image-product-1.jpg" class="first-sneaker" />

            <div class="images-4">
              <img src="images/image-product-1-thumbnail.jpg" />
              <img src="images/image-product-2-thumbnail.jpg" />
              <img src="images/image-product-3-thumbnail.jpg" />
              <img src="images/image-product-4-thumbnail.jpg" />
            </div>
          </div>

          <div class="features">
            <p class="company">Sneaker Company</p>
            <h2>Fall Limited Edition Sneakers</h2>
            <p class="about">
              These low-profile sneakers are your perfect casual wear companion.
              Featuring a durable rubber outer sole, they are all withstand
              everything the weather can offer.
            </p>

            <div class="price">
              <p class="current-price"><strong>$125.00</strong></p>
              <span class="sale"><strong>50%</strong></span>
            </div>

            <p class="old-price"><strong>250$</strong></p>

            <div class="cart-section">
              <div class="counter">
                <button class="btn minus"><strong>−</strong></button>
                <span id="count"><strong>1</strong></span>
                <button class="btn plus"><strong>+</strong></button>
              </div>

              <div class="class-orange">
                <img src="images/icon-cart.svg" class="cart-img" />
                <p><strong>Add to cart</strong></p>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
